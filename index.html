<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=350, height=550, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#060e0a">
  <title>tapout</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden; font-family: 'Courier New', monospace;
      touch-action: none;
    }
    body {
      display: flex; align-items: center; justify-content: center;
    }
    #app {
      position: relative; width: 350px; height: 550px; background: #060e0a;
      border: 2px solid #39ff8c; box-shadow: 0 0 32px rgba(57,255,140,0.2);
      overflow: hidden;
    }
    #screen { display: block; width: 350px; height: 550px; image-rendering: pixelated; }
    .overlay, .hud, .controls {
      position: absolute; left: 0; right: 0; pointer-events: none;
    }
    .overlay { inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 40; }
    .panel {
      width: 100%; max-width: 280px; padding: 18px; border: 2px solid #39ff8c;
      background: rgba(6, 14, 10, 0.9); text-align: center; color: #eaffea;
    }
    .panel h1, .panel h2 { margin: 0 0 8px; letter-spacing: 3px; color: #39ff8c; }
    .panel p, .panel .sub { color: #8fffb8; margin: 6px 0; font-size: 12px; }
    .menu-btn {
      margin-top: 12px; border: 2px solid #39ff8c; background: #0c1a12; color: #eaffea;
      padding: 10px 14px; font: inherit; letter-spacing: 2px; width: 100%; touch-action: none;
      pointer-events: auto;
    }
    .menu-btn.pressed { background: #39ff8c; color: #041006; }
    .hidden { display: none !important; }
    .hud {
      top: 0; padding: 10px 12px; z-index: 20; display: flex; flex-direction: column; gap: 6px;
    }
    .bar-row { display: flex; align-items: center; gap: 8px; }
    .bar-row.right { justify-content: flex-end; }
    .label { color: #39ff8c; font-size: 11px; letter-spacing: 1px; }
    .bar {
      width: 140px; height: 10px; border: 1px solid #39ff8c; background: rgba(4, 16, 6, 0.95);
      overflow: hidden;
    }
    .fill {
      width: 100%; height: 100%; background: linear-gradient(90deg, #0f0, #39ff8c);
      transition: width 0.15s linear;
    }
    .fill.enemy { background: linear-gradient(90deg, #39ff8c, #ff8a3b); }
    .status { color: #eaffea; font-size: 11px; text-align: center; letter-spacing: 1px; }
    .hud-stats { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #8fffb8; letter-spacing: 1px; }
    .hud-stats .pill { border: 1px solid #39ff8c; padding: 2px 6px; }
    .controls {
      bottom: 0; padding: 12px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 30;
    }
    .stick {
      width: 96px; height: 96px; border-radius: 50%; border: 2px solid #39ff8c; position: relative;
      background: radial-gradient(circle, #0c1a12 0%, #060e0a 70%); pointer-events: auto; touch-action: none;
    }
    .stick-nub {
      position: absolute; width: 36px; height: 36px; border-radius: 50%; background: #39ff8c;
      top: 30px; left: 30px; box-shadow: 0 0 10px #39ff8c;
    }
    .action-grid {
      display: grid; grid-template-columns: repeat(2, 54px); gap: 8px; pointer-events: auto;
    }
    .abtn {
      width: 54px; height: 54px; border-radius: 50%; border: 2px solid #39ff8c; background: #0c1a12;
      color: #eaffea; font-weight: 700; font-size: 14px; touch-action: none;
    }
    .abtn.pressed { background: #39ff8c; color: #041006; }
    .abtn.block { border-color: #6fb8ff; }
    .abtn.block.pressed { background: #6fb8ff; }
    .abtn.special { border-color: #ff8a3b; }
    .abtn.special.pressed { background: #ff8a3b; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="screen" width="350" height="550"></canvas>

    <div id="titleOverlay" class="overlay">
      <div class="panel">
        <h1>tapout</h1>
        <p>TOUCH ONLY</p>
        <div class="sub">ANDROID CHROME • 350×550</div>
        <button id="startBtn" class="menu-btn">TAP TO BEGIN</button>
      </div>
    </div>

    <div id="hud" class="hud hidden">
      <div class="bar-row">
        <div class="label">YOU</div>
        <div class="bar"><div id="p1Bar" class="fill"></div></div>
      </div>
      <div class="bar-row right">
        <div class="bar"><div id="p2Bar" class="fill enemy"></div></div>
        <div class="label">RIVAL</div>
      </div>
      <div class="hud-stats">
        <div id="timerText" class="pill">TIME 99</div>
        <div id="comboText" class="pill">COMBO 0</div>
      </div>
      <div id="statusText" class="status">READY</div>
    </div>

    <div id="controls" class="controls hidden">
      <div id="stick" class="stick"><div id="stickNub" class="stick-nub"></div></div>
      <div class="action-grid">
        <button id="btnPunch" class="abtn">P</button>
        <button id="btnKick" class="abtn">K</button>
        <button id="btnBlock" class="abtn block">B</button>
        <button id="btnSpecial" class="abtn special">S</button>
      </div>
    </div>

    <div id="resultOverlay" class="overlay hidden">
      <div class="panel">
        <h2 id="resultTitle">YOU WIN</h2>
        <p id="resultText">PLAY AGAIN?</p>
        <button id="retryBtn" class="menu-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script type="module" src="./boot.js"></script>
</body>
</html>
